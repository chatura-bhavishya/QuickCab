# Runs the whole app: MySQL + Spring Boot API + React (nginx).
#   1. cp .env.example .env   and set MYSQL_ROOT_PASSWORD and JWT_SECRET
#   2. docker compose up --build
#   3. open http://localhost:3000
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cabdb
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    # No ports published: only the API can reach the database.

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/cabdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (32+ characters)}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  db-data:
