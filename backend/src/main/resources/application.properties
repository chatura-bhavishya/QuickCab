spring.application.name=cabapp

# Optionally load local settings from backend/.env (git-ignored).
# Real environment variables take precedence. See backend/.env.example.
spring.config.import=optional:file:.env[.properties]

# Database - credentials must come from the environment, never from source control.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cabdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Never leak stack traces or exception messages in HTTP error responses.
server.error.include-stacktrace=never
server.error.include-message=never

server.port=${PORT:8080}

# JWT signing secret (at least 32 characters). Required - there is no default.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# Exact origin(s) of the React app allowed to call the API (comma-separated).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
