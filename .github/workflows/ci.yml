name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Cancel an older run of the same branch/PR when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Unit, web-layer and H2 integration tests, then package the jar.
      - name: Test and build
        run: ./mvnw -B verify

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      # Only checks that the images build; the values are dummies.
      - name: Build images with docker compose
        env:
          MYSQL_ROOT_PASSWORD: ci-dummy-password
          JWT_SECRET: ci-dummy-secret-that-is-long-enough-1234
        run: docker compose build
